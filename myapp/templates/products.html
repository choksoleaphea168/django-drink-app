{% extends 'base.html' %}

{% block title %}Products{% endblock title %}

{% block content %}
    <h5>Products</h5>
    <ul>
        {% for product in products %}
            <li>{{ product.name }} - ${{ product.price }}
                
                {% if product.in_stock %}
                    in stock
                {% else %}
                    out of stock
                {% endif %}
                    
            </li>
        {% endfor %}
    </ul>
{% endblock %}
